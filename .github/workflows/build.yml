name: build-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install RN deps
        run: npm install --no-audit --no-fund

      - name: Install Node-side deps (nodejs-assets)
        run: npm run prepare-node-assets

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Upload APK (short-lived CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: solid-pod-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish APK to "latest" release (durable download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk solid-pod.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest solid-pod.apk \
            --title 'Solid Pod — latest build' \
            --notes 'Debug-signed APK for sideloading (not the Play Store). Built from main. Enable install-from-unknown-sources for your browser or file manager, then open the APK.'
